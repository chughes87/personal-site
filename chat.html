<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat &mdash; pointfree.space</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body class="terminal-page">
  <div id="terminalWrap">
    <pre id="chatTerminal"></pre>

    <!-- Gate overlay -->
    <div class="chat-overlay chat-gate-overlay" id="chatGate" hidden>
      <form id="gateForm" class="chat-gate-form">
        <label class="chat-gate-label" for="usernameInput">&gt; Enter your name:</label>
        <div class="chat-gate-row">
          <input type="text" id="usernameInput" maxlength="30"
                 placeholder="your name" autocomplete="off"
                 aria-label="Display name" required>
          <button type="submit" class="chat-gate-btn">Join</button>
        </div>
      </form>
    </div>

    <!-- Chat overlay -->
    <div class="chat-overlay" id="chatUI" hidden>
      <div class="chat-messages-overlay" id="chatMessages"
           role="log" aria-live="polite" aria-label="Chat messages">
        <p class="chat-empty" id="chatEmpty">No messages yet &mdash; say hello!</p>
      </div>
      <div class="chat-input-bar">
        <span class="chat-prompt-user" id="displayName"></span>
        <button type="button" class="chat-rename" id="renameBtn">[change]</button>
        <form id="chatForm" class="chat-input-form">
          <span class="chat-prompt-caret">&gt;</span>
          <input type="text" id="messageInput" maxlength="500"
                 placeholder="type a message..." autocomplete="off"
                 aria-label="Message" required>
          <button type="submit" class="chat-send-btn" id="sendBtn">Send</button>
        </form>
        <span class="chat-char-count"><span id="charCount">0</span>/500</span>
      </div>
    </div>
  </div>

  <noscript>
    <div class="noscript-fallback">
      <h1>Chat</h1>
      <p>JavaScript is required for the chat room.</p>
      <p><a href="/">Home</a></p>
    </div>
  </noscript>

  <!-- Set this to your API Gateway URL after running: sam deploy -->
  <script>window.CHAT_API_BASE = 'https://TODO.execute-api.us-west-1.amazonaws.com';</script>
  <script src="src/main.js"></script>
  <script src="src/terminal.js"></script>
  <script src="src/chat.js"></script>
</body>
</html>
